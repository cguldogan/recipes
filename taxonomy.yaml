# taxonomy.yaml — Controlled vocabulary for vLLM recipes
# All hardware_profiles, tasks, and strategies referenced in recipes must be defined here.

hardware_profiles:
  # ── NVIDIA Hopper ──
  h100:
    brand: NVIDIA
    generation: hopper
    display_name: "H100"
    description: "NVIDIA H100 80GB NVLink (8-GPU node)"
    gpu_count: 8
    vram_gb: 640
    multi_node: false

  h200:
    brand: NVIDIA
    generation: hopper
    display_name: "H200"
    description: "NVIDIA H200 SXM 141 GB HBM3e · 8-GPU HGX node"
    gpu_count: 8
    vram_gb: 1128
    multi_node: false

  # ── NVIDIA Blackwell ──
  # Specs follow semianalysis InferenceX GPU table (inferencex.semianalysis.com/gpu-specs).
  b200:
    brand: NVIDIA
    generation: blackwell
    display_name: "B200"
    description: "NVIDIA B200 SXM 180 GB HBM3e · 8-GPU HGX B200 node"
    gpu_count: 8
    vram_gb: 1440
    multi_node: false

  gb200:
    brand: NVIDIA
    generation: blackwell
    display_name: "GB200 NVL4"
    description: "NVIDIA GB200 Grace-Blackwell compute tray · 192 GB HBM3e/GPU · 4 Blackwell GPUs (NVL72 tray unit)"
    gpu_count: 4
    vram_gb: 768
    multi_node: false

  # ── NVIDIA Blackwell (consumer) ──
  # Consumer/workstation Blackwell parts. `restricted: true` keeps them out of
  # the default hardware picker — they only appear for recipes that explicitly
  # opt in via `meta.hardware` (e.g. `rtx5090: verified`), since the vast
  # majority of recipes target multi-GPU server nodes that won't fit on a
  # single 32 GB consumer card.
  # `workstation: true` marks single-chassis consumer/workstation rigs. Unlike
  # server nodes (H200, B200…), you can't form a real 2-node cluster from one
  # desktop, so the command builder never bumps these to multi-node — it keeps
  # the honest single-node command (and flags it if the model doesn't fit).
  rtx5090:
    brand: NVIDIA
    generation: blackwell
    display_name: "RTX 5090"
    description: "NVIDIA GeForce RTX 5090 · 32 GB GDDR7 · single-GPU workstation (consumer Blackwell, GB202, PCIe)"
    gpu_count: 1
    vram_gb: 32
    multi_node: false
    workstation: true
    restricted: true

  # ── Local workstation rig (2× RTX 5090 + RTX PRO 6000) ──
  # Personal home rig. These are NOT restricted, so they always show as pills
  # in the command builder. The two homogeneous pools are modelled here; the
  # mixed all-3 (32+32+96) configuration is intentionally absent because vLLM
  # can't cleanly tensor-parallel across uneven VRAM — it lives only as a
  # total-VRAM budget in the Browse "My rig" filter.
  rtx5090_x2:
    brand: NVIDIA
    generation: blackwell
    display_name: "RTX 5090 ×2"
    description: "2× NVIDIA GeForce RTX 5090 · 32 GB GDDR7 each · 64 GB pool · TP=2 workstation (consumer Blackwell, GB202)"
    gpu_count: 2
    vram_gb: 64
    multi_node: false
    workstation: true

  rtx_pro_6000:
    brand: NVIDIA
    generation: blackwell
    display_name: "RTX PRO 6000"
    description: "NVIDIA RTX PRO 6000 Blackwell · 96 GB GDDR7 · single-GPU workstation (Blackwell, GB202)"
    gpu_count: 1
    vram_gb: 96
    multi_node: false
    workstation: true

  # ── NVIDIA Blackwell Ultra ──
  b300:
    brand: NVIDIA
    generation: blackwell
    display_name: "B300"
    description: "NVIDIA B300 SXM 268 GB HBM3e · 8-GPU HGX B300 node (Blackwell Ultra)"
    gpu_count: 8
    vram_gb: 2144
    multi_node: false

  gb300:
    brand: NVIDIA
    generation: blackwell
    display_name: "GB300 NVL4"
    description: "NVIDIA GB300 Grace-Blackwell Ultra compute tray · 288 GB HBM3e/GPU · 4 GPUs (NVL72 tray unit)"
    gpu_count: 4
    vram_gb: 1152
    multi_node: false

  # ── AMD Instinct ──
  mi300x:
    brand: AMD
    generation: amd
    display_name: "MI300X"
    description: "AMD Instinct MI300X 192 GB HBM3 · 8-GPU OAM node (CDNA 3)"
    gpu_count: 8
    vram_gb: 1536
    multi_node: false

  mi325x:
    brand: AMD
    generation: amd
    display_name: "MI325X"
    description: "AMD Instinct MI325X 256 GB HBM3e · 8-GPU OAM node (CDNA 3)"
    gpu_count: 8
    vram_gb: 2048
    multi_node: false

  mi355x:
    brand: AMD
    generation: amd
    display_name: "MI355X"
    description: "AMD Instinct MI355X 288 GB HBM3e · 8-GPU OAM node (CDNA 4)"
    gpu_count: 8
    vram_gb: 2304
    multi_node: false

  # ── Google Cloud TPU ──
  # `restricted: true` hides these from the hardware picker unless the recipe
  # explicitly lists them in `meta.hardware` — TPU support requires a separate
  # vLLM build and is only declared on the recipes that have been validated.
  trillium:
    brand: Google
    generation: tpu
    display_name: "TPU v6e (Trillium)"
    description: "Google Cloud TPU v6e Trillium · 32 GB HBM/chip · served via vLLM TPU"
    gpu_count: 8
    vram_gb: 256
    multi_node: false
    restricted: true

  ironwood:
    brand: Google
    generation: tpu
    display_name: "TPU v7 (Ironwood)"
    description: "Google Cloud TPU v7 Ironwood · 192 GB HBM/chip · served via vLLM TPU"
    gpu_count: 1
    vram_gb: 192
    multi_node: false
    restricted: true

tasks:
  - id: text
    display_name: "Text"
    description: "Text-only models: chat, reasoning, code generation, tool calling"
  - id: multimodal
    display_name: "Multimodal"
    description: "Vision, audio, or other modalities beyond text"
  - id: omni
    display_name: "Omni"
    description: "Any-to-any models: text + vision + audio + generation"
  - id: embedding
    display_name: "Embedding"
    description: "Embedding, reranker, classifier, scoring models"

strategies:
  - single_node_tp
  - single_node_tep
  - single_node_dep
  - multi_node_tp
  - multi_node_tep
  - multi_node_dep
  - multi_node_tp_pp
  - pd_cluster
